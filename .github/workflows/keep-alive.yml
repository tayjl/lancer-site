# Keeps the free Supabase project from pausing. Free projects pause after a week with no activity, so this
# sends one cheap request to the database every 3 days (Actions > Keep Supabase awake > Run workflow does it by hand).
#
# Setup: add two repository VARIABLES (not secrets) under Settings > Secrets and variables > Actions > Variables:
#   SUPABASE_URL              e.g. https://abcdefgh.supabase.co
#   SUPABASE_PUBLISHABLE_KEY  the publishable (anon) key. It's public: it's already in the built site.
#
# The request reads one row of content_items. Logged-out visitors have no access to it, so Postgres answers
# "permission denied" (401/403), but that answer only comes from a database that's awake and running the query.
# Any answer below 500 counts as awake; a 5xx or no answer fails the job (GitHub then emails you).
# GitHub switches scheduled workflows off after 60 days without repo activity; push anything (or re-enable it under Actions) if that happens.
name: Keep Supabase awake

on:
  schedule:
    - cron: '17 6 */3 * *'
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Query the database
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ vars.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_PUBLISHABLE_KEY" ]; then
            echo "Set the SUPABASE_URL and SUPABASE_PUBLISHABLE_KEY repository variables." >&2
            exit 1
          fi
          # 000 means curl got no answer at all.
          status=$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' --max-time 60 --retry 2 --retry-all-errors \
            -H "apikey: $SUPABASE_PUBLISHABLE_KEY" \
            "${SUPABASE_URL%/}/rest/v1/content_items?select=id&limit=1") || status=000
          echo "Supabase answered HTTP $status"
          if [ "$status" = 000 ] || [ "$status" -ge 500 ]; then
            echo "The project didn't answer properly. It may be paused: restore it from the Supabase dashboard." >&2
            exit 1
          fi
