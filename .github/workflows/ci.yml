# Runs the unit tests and the build, then the database (pgTAP) tests, on every push and pull request to main.
# The VITE_ values below are dummies: the build only needs them to exist. No real secrets are used here.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  app:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      VITE_SUPABASE_URL: https://placeholder.supabase.co
      VITE_SUPABASE_PUBLISHABLE_KEY: placeholder-publishable-key
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build

  database:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          version: 3.4.0
      # Studio, the image proxy and the other extras aren't needed to run the SQL tests.
      - name: Start local Supabase
        run: supabase start -x studio,imgproxy,mailpit,edge-runtime,logflare,vector,supavisor
      - name: Run database tests
        run: supabase test db
